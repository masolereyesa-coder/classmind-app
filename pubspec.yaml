name: classmind
description: ClassMind - Grabacion y notas inteligentes para clases universitarias.
publish_to: 'none'
version: 1.3.0+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  flutter_markdown: ^0.6.22
  intl: ^0.19.0
  pdf: ^3.10.8
  share_plus: ^10.1.0
  record: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
